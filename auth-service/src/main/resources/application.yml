server:
  port: 8080

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/kino
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cloud:
    openfeign:
      client:
        config:
          user-service:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: basic

logging:
  level:
    org.springframework.security: TRACE

services:
  user-service:
    url: http://localhost:8081